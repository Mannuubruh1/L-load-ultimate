[package]
name = "l_load"
version = "0.1.0"
edition = "2021"
description = "L-Load Skyline plugin for Smash Ultimate"

[package.metadata.skyline]
titleid = "01006A800016E000" # Super Smash Bros. Ultimate

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = "0.6"
l_load_core = { path = "../core" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

# Standalone package: it builds for the Switch target with cargo-skyline, so it
# must not be part of the host workspace in the repo root.
[workspace]
